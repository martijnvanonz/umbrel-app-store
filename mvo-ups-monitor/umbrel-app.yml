manifestVersion: "1.1"
id: mvo-ups-monitor
name: UPS Monitor
tagline: Gracefully shut down Umbrel when a remote NUT UPS hits low battery
icon: https://raw.githubusercontent.com/martijnvanonz/umbrel-app-store/master/mvo-ups-monitor/icon.png
category: networking
version: "0.7.0"
port: 8099
description: >-
  Umbrel has no built-in UPS support and no UPS/NUT app exists in any store.
  UPS Monitor gracefully shuts down your Umbrel when a remote NUT (Network UPS
  Tools) server reports "Low Battery" — using the raw NUT protocol (port 3493),
  so no extra REST layer, SSH keys, or Portainer are needed. It persists across
  reboots and updates because it's a real Umbrel app.


  ── Configuration ──

  After installing, open the app to reach its built-in settings page and enter
  your NUT server details. No environment variables or terminal needed. Fields:


  • NUT server IP — the machine running nut-server on your network

  • NUT server port — default 3493

  • UPS name — as defined on your NUT server (commonly "ups")

  • Shut down when battery drops to this % — the main control. Leave blank to shut
    down only when the UPS itself signals critical low battery. Set e.g. 20 to shut
    down earlier, with more margin.

  • Shut down after this many seconds on battery — optional. Shuts down when the
    power has been out this long without a break (e.g. 90). Leave blank to turn off.

  • Poll interval (seconds) — how often to query the NUT server (default 15)


  The app always shuts down when the UPS reports critical low battery or Forced
  Shutdown (FSD), so you are protected even if you leave the optional fields blank.


  Your NUT server must accept network queries. Test with:
  printf 'GET VAR ups ups.status\nLOGOUT\n' | nc <nut-host> 3493
developer: Matthijs
website: https://github.com/martijnvanonz/umbrel-app-store
submitter: Martijn
submission: https://github.com/martijnvanonz/umbrel-app-store
repo: https://github.com/martijnvanonz/umbrel-app-store
support: https://github.com/martijnvanonz/umbrel-app-store/issues
gallery: []
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "10s"
    endpoint: "monitor:8099/widgets/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Status"
          text: "Online"
          subtext: ""
        - title: "Battery"
          text: "100"
          subtext: "%"
        - title: "Runtime"
          text: "52"
          subtext: "min"
        - title: "Load"
          text: "12"
          subtext: "%"
releaseNotes: >-
  Hardened fork of empewoow/umbrel-app-store. The image is built by this repository's
  own CI from the reviewed source only: GitHub Actions are pinned to commit SHAs, the
  base image is pinned by digest, and no :latest tag is pushed. New: the host is also
  shut down on Forced Shutdown (FSD) from the NUT master, and on a new optional timer
  (seconds continuously on battery). Shutdown now runs poweroff first, the same command
  as umbrelOS's own Shutdown button, and the reason is shown on the status page.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
