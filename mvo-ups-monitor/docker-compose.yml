version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mvo-ups-monitor_monitor_1
      APP_PORT: 8099

  monitor:
    # Prebuilt multi-arch image (see .github/workflows/docker-publish.yml).
    # umbrelOS does not build from source — it only pulls this image.
    # TODO: after the first CI run, append @sha256:<digest> (printed by the workflow's
    # last step) so the exact reviewed build is pinned.
    image: ghcr.io/martijnvanonz/umbrel-ups-monitor:0.7.0
    restart: on-failure
    # host access so we can shut the host down via nsenter -t 1
    pid: host
    privileged: true
    # All configuration is done in the app's built-in settings page and stored in
    # ${APP_DATA_DIR}/state — no environment variables needed.
    volumes:
      - ${APP_DATA_DIR}/state:/state
