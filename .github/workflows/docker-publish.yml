name: Build & publish image

# Builds the UPS monitor image multi-arch (amd64 + arm64) and pushes it to
# GitHub Container Registry. umbrelOS does not build — it only pulls this image.
# Every action is pinned to a full commit SHA (version in the trailing comment).

on:
  push:
    branches: [master]
    paths:
      - "mvo-ups-monitor/Dockerfile"
      - "mvo-ups-monitor/watch.sh"
      - "mvo-ups-monitor/entrypoint.sh"
      - "mvo-ups-monitor/server.py"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

env:
  IMAGE: ghcr.io/martijnvanonz/umbrel-ups-monitor
  VERSION: "0.7.0"        # bump this together with version in umbrel-app.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0 (arm64 emulation)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./mvo-ups-monitor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Print image digest (for pinning docker-compose.yml)
        run: |
          echo "Pin docker-compose.yml to:"
          echo "  ${{ env.IMAGE }}:${{ env.VERSION }}@${{ steps.build.outputs.digest }}"
